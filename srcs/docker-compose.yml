services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: on-failure
    networks:
      - inception
    volumes:
      - db_data:/var/lib/mysql
    env_file: .env
    secrets:
      - db_password
      - db_root_password

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: on-failure
    networks:
      - inception
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - mariadb
    env_file: .env
    secrets:
      - wp_admin_password
      - db_password

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: on-failure
    networks:
      - inception
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - wordpress
    env_file: .env

networks:
  inception:
    driver: bridge

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aouaalla/data/db
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aouaalla/data/wp

secrets:
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
