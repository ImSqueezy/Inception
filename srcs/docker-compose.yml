services:
  mariadb:
    container_name: mariadb
    build: requirements/mariadb/
    image: mariadb:inception
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: on-failure
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root", "-p${MDB_ROOT_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  wordpress:
    container_name: wordpress
    build: requirements/wordpress/
    image: wordpress:inception
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: on-failure
    depends_on:
      mariadb:
        condition: service_healthy

  nginx:
    container_name: nginx
    build: requirements/nginx/
    image: nginx:inception
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception
    restart: on-failure
    depends_on:
    - wordpress
    - website
    - adminer

  redis:
    container_name: redis
    build: requirements/redis/
    image: redis:inception
    networks:
      - inception
    restart: on-failure

  ftp:
    container_name: ftp
    build: requirements/ftp/
    image: ftp:inception
    env_file:
      - .env
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: on-failure
    depends_on:
      - wordpress

  adminer:
    container_name: adminer
    build: requirements/adminer/
    image: adminer:inception
    env_file:
      - .env
    networks:
      - inception
    restart: on-failure
    depends_on:
      - mariadb

  website:
    container_name: website
    build: requirements/website/
    image: website:inception
    networks:
      - inception
    restart: on-failure

networks:
  inception:
    name: inception
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/$USER/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/$USER/data/wordpress
