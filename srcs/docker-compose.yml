services:
  mariadb:
    container_name: mariadb
    build: requirements/mariadb/.
    image: mariadb:inception
    environment:
      - MDB_ROOT_PASS=${MDB_ROOT_PASS}
      - MDB_DATABASE=${MDB_DATABASE}
      - MDB_USER=${MDB_USER}
      - MDB_PASSWORD=${MDB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: on-failure
    healthcheck:
      test: "mysqladmin ping -h localhost -u root -p$MDB_ROOT_PASS --silent"
      start_period: 30s
      interval: 5s
      timeout: 3s
      retries: 3

  wordpress:
    container_name: wordpress
    build: requirements/wordpress/
    image: wordpress:inception
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - MDB_DATABASE=${MDB_DATABASE}
      - MDB_USER=${MDB_USER}
      - MDB_PASSWORD=${MDB_PASSWORD}
      - WP_TITLE=${WP_TITLE}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_EMAIL=${WP_EMAIL}
      - WP_PASSWORD=${WP_PASSWORD}
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: on-failure
    depends_on:
      mariadb:
        condition: service_healthy

  # nginx:
  #   container_name: nginx
  #   build: requirements/nginx/
  #   image: nginx:inception
  #   ports:
  #     - "443:443"
  #   volumes:
  #     - wordpress_data:/var/www/html:ro
  #   networks:
  #     - inception
  #   restart: on-failure
  #   depends_on:
  #     - wordpress


networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/$USER/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/$USER/data/wordpress
