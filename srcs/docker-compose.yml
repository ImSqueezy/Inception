services:
  mariadb:
    container_name: mariadb
    build: requirements/mariadb/
    image: mariadb:inception
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: on-failure

  wordpress:
    container_name: wordpress
    build: requirements/wordpress/
    image: wordpress:inception
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: on-failure
    depends_on:
      - mariadb

  nginx:
    container_name: nginx
    build: requirements/nginx/
    image: nginx:inception
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
      - adminer_data:/var/www/adminer:ro
    networks:
      - inception
    restart: on-failure
    depends_on:
      - wordpress

  redis:
    container_name: redis
    build: requirements/redis/
    image: redis:inception
    networks:
      - inception
    restart: on-failure

  ftp:
    container_name: ftp
    build: requirements/ftp/
    image: ftp:inception
    env_file:
      - .env
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: on-failure
    depends_on:
      - wordpress

  adminer:
    container_name: adminer
    build: requirements/adminer/
    image: adminer:inception
    volumes:
      - adminer_data:/var/www/adminer
    networks:
      - inception
    restart: on-failure
    depends_on:
      - mariadb

  website:
    container_name: website
    build: requirements/website/
    image: website:inception
    networks:
      - inception
    restart: on-failure

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/$USER/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/$USER/data/wordpress
  adminer_data: