services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: always
    networks:
      - inception
    volumes:
      - db_data:/var/lib/mysql
    env_file: .env

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: always
    networks:
      - inception
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - mariadb
    env_file: .env

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: always
    networks:
      - inception
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - wordpress
    env_file: .env

networks:
  inception:
    driver: bridge

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aouaalla/data/db
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aouaalla/data/wp
