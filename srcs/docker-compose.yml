services:
  mariadb:
    container_name: mariadb
    build: requirements/mariadb/
    image: mariadb:inception
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: on-failure

  wordpress:
    container_name: wordpress
    build: requirements/wordpress/
    image: wordpress:inception
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: on-failure
    depends_on:
      - mariadb

  # nginx:
  #   container_name: nginx
  #   build: requirements/nginx/
  #   image: nginx:inception
  #   ports:
  #     - "443:443"
  #   volumes:
  #     - wordpress_data:/var/www/html:ro
  #   networks:
  #     - inception
  #   restart: on-failure
  #   depends_on:
  #     - wordpress


networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/$USER/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/$USER/data/wordpress
