server {
    listen 443 ssl;
    server_name localhost ${DOMAIN_NAME};

    ssl_certificate /etc/nginx/ssl/certs/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/certs/certificate.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

server {
    listen 443 ssl;
    server_name portfolio.localhost;

    ssl_certificate /etc/nginx/ssl/certs/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/certs/certificate.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://website:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name adminer.localhost;

    ssl_certificate /etc/nginx/ssl/certs/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/certs/certificate.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://adminer:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}