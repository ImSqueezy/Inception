server {
    listen 443 ssl;
    server_name localhost ${DOMAIN_NAME};
    ssl_certificate /etc/nginx/ssl/certs/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/certs/certificate.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    
}

server {
    listen 443 ssl;
    server_name portfolio.localhost portfolio.${DOMAIN_NAME};

    ssl_certificate /etc/nginx/ssl/certs/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/certs/certificate.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://website:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name adminer.localhost adminer.${DOMAIN_NAME};

    ssl_certificate /etc/nginx/ssl/certs/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/certs/certificate.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/adminer;
    index index.php;

    location / {
        try_files $uri /index.php;
    }

    location ~ \.php$ {
        fastcgi_pass adminer:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
    }
}